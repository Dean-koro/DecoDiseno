<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Galerías | Deco Diseño</title>
  
  <!-- Estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  
  <!-- Scripts Externos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Lógica Interna Extraída -->
  <script src="admin.js" defer></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

  <div id="app" class="max-w-6xl mx-auto p-6">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Gestor Visual de Galerías</h1>
        <p class="text-sm text-slate-500">Deco Diseño — Administra y encuadra las imágenes del sitio</p>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <label for="sectionSelect" class="text-sm font-semibold text-slate-700 whitespace-nowrap">Galería:</label>
        <select id="sectionSelect" class="w-full md:w-72 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 font-medium text-slate-800 focus:ring-2 focus:ring-slate-900 focus:outline-none transition">
          <option value="cortinas">Cortinas y Persianas</option>
          <option value="tapiceria_mobi">Tapicería Residencial</option>
          <option value="toldos">Toldos</option>
          <option value="tapiceria_auto">Tapicería Automotriz</option>
          <option value="tapiceria_nautica">Tapicería Náutica</option>
          <option value="tapiceria_exterior">Tapicería Exterior</option>
        </select>
      </div>
    </header>

    <div id="statusAlert" class="hidden mb-6 p-4 rounded-xl font-medium text-sm transition-all"></div>
    <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

    <div class="mt-8 flex justify-end">
      <button id="saveBtn" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Publicar Cambios en la Web
      </button>
    </div>
  </div>

  <!-- Modal Cropper -->
  <div id="cropModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl flex flex-col gap-4">
      <h3 class="text-lg font-bold text-slate-900">Ajustar Encuadre de la Imagen</h3>
      <p class="text-xs text-slate-500">Mueve y escala el recuadro para definir la vista previa cuadrada.</p>

      <div class="max-h-[60vh] overflow-hidden bg-slate-900 rounded-2xl flex items-center justify-center">
        <img id="cropImage" src="" class="max-w-full block" />
      </div>

      <div class="flex justify-end gap-3 mt-2">
        <button id="cancelCropBtn" class="px-5 py-2.5 rounded-xl border border-slate-300 font-semibold text-slate-700 hover:bg-slate-100 transition">Cancelar</button>
        <button id="applyCropBtn" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 transition">Aplicar Encuadre</button>
      </div>
    </div>
  </div>

  <div id="modalConfirmar" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
    <h3 class="text-lg font-bold text-gray-900 mb-2">Confirmar eliminación</h3>
    <p class="text-sm text-gray-600 mb-6">Esta acción quitará la imagen de la grilla. ¿Deseas continuar?</p>
    <div class="flex justify-end gap-3">
      <button id="btnCancelarBorrado" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md transition">
        Cancelar
      </button>
      <button id="btnConfirmarBorrado" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md transition">
        Eliminar
      </button>
    </div>
  </div>
</div>

</body>
</html>
